apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-registry
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-registry
  template:
    metadata:
      labels:
        app: local-registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: registry-data
              mountPath: /var/lib/registry
      volumes:
        - name: registry-data
          emptyDir: {} # Chỉ thử nghiệm, dữ liệu sẽ mất khi pod restart
---
apiVersion: v1
kind: Service
metadata:
  name: local-registry
  namespace: default
spec:
  selector:
    app: local-registry
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---

